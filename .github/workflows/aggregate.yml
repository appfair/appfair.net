name: Aggregate and Deploy

on:
  schedule:
    # Hourly: re-poll every appfair org repo's latest release for an
    # appindex.json and rebuild the catalog site.
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout appfair.net
        uses: actions/checkout@v6

      - name: Checkout appland template
        uses: actions/checkout@v6
        with:
          repository: appfair/appland
          path: site/appland
          #ref: v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm

      - name: Install script dependencies
        # scripts/fdroid-mirror.mjs needs the `yaml` package (fdroid/curated.yaml)
        run: npm ci

      - name: Aggregate appindex.json from appfair org releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Writes site/appindex.json (build input for the template) AND
        # site/public/appindex.v1.json (downloadable copy served at
        # https://appfair.net/appindex.v1.json after deploy).
        run: node scripts/aggregate.mjs

      - name: Derive curated F-Droid repo index
        # Filters the official f-droid.org index-v2.json down to the curated
        # subset in fdroid/curated.yaml. Writes site/public/repo/
        # {index-v2.json,entry.json}; served at https://appfair.net/repo/
        # after deploy. APKs are not mirrored — clients fetch them from the
        # official f-droid.org mirror pool listed in the index.
        run: node scripts/fdroid-mirror.mjs

      - name: Sign F-Droid repo index
        # Packages entry.json into entry.jar and signs it with the repo key
        # (v1 JAR signature, as F-Droid clients require). The PKCS12 keystore
        # lives in the FDROID_KEYSTORE_P12_B64 secret (base64); see
        # fdroid/README.md for how to generate and register it.
        env:
          FDROID_KEYSTORE_P12_B64: ${{ secrets.FDROID_KEYSTORE_P12_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$FDROID_KEYSTORE_P12_B64" ]; then
            echo "::warning::FDROID_KEYSTORE_P12_B64 secret not set — the" \
              "F-Droid index ships unsigned (no entry.jar), so F-Droid" \
              "clients cannot add the repo yet. See fdroid/README.md."
            exit 0
          fi
          printf '%s' "$FDROID_KEYSTORE_P12_B64" | base64 -d \
            > "$RUNNER_TEMP/fdroid-keystore.p12"
          FDROID_KEYSTORE="$RUNNER_TEMP/fdroid-keystore.p12" \
            scripts/fdroid-sign.sh site/public/repo
          rm -f "$RUNNER_TEMP/fdroid-keystore.p12"

      - name: Merge public files into template
        run: |
          if [ -d site/public ]; then
            mkdir -p site/appland/public
            cp -R site/public/. site/appland/public/
          fi

      - name: Build with Astro
        id: build
        uses: withastro/action@v6
        with:
          path: site/appland

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
