name: Aggregate and Deploy

on:
  schedule:
    # Hourly: re-poll every appfair org repo's latest release for an
    # appindex.json and rebuild the catalog site.
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout appfair.net
        uses: actions/checkout@v6

      - name: Checkout appland template
        uses: actions/checkout@v6
        with:
          repository: appfair/appland
          path: site/appland
          #ref: v1

      - name: Setup Node
        uses: actions/setup-node@v6

      - name: Aggregate appindex.json from appfair org releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Writes site/appindex.json (build input for the template) AND
        # site/public/appindex.v1.json (downloadable copy served at
        # https://appfair.net/appindex.v1.json after deploy).
        run: node scripts/aggregate.mjs

      - name: Merge public files into template
        run: |
          if [ -d site/public ]; then
            mkdir -p site/appland/public
            cp -R site/public/. site/appland/public/
          fi

      - name: Build with Astro
        id: build
        uses: withastro/action@v6
        with:
          path: site/appland

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
